# Fintech Médias — Nginx de l'hôte (VPS partagé).
# Installé dans /etc/nginx/conf.d/fintechmedias.conf ; ne touche à aucun autre site.
# Certbot (--nginx) ajoute ensuite les blocs 443/SSL dans ce fichier.
#
# Upstreams Docker (liés à 127.0.0.1) :
#   web  → 127.0.0.1:3010 (Next)
#   api  → 127.0.0.1:3011 (Nest)

server {
    listen 80;
    listen [::]:80;
    server_name fintechmedias.com www.fintechmedias.com;

    client_max_body_size 200M;

    # Routage identique au Worker Cloudflare : /api/* → Nest
    location /api/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location = /api {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PDF / médias R2 — stream direct (évite timeout via Next)
    location /cdn-media/ {
        proxy_pass https://cdn.fintechmedias.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host cdn.fintechmedias.com;
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.fintechmedias.com;

    client_max_body_size 200M;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
