# Ancien déploiement VPS OVH — désactivé.
# La prod passe par Cloudflare : deploy-cloudflare.yml
#
# Pour le réactiver un jour : restaurer les triggers push / workflow_dispatch
# et configurer VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PORT.

name: Deploy production (OVH — disabled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Taper oui pour forcer un deploy OVH (secrets VPS_* requis)"
        required: true
        default: "non"

jobs:
  deploy:
    name: Deploy to OVH VPS
    if: ${{ github.event.inputs.confirm == 'oui' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          if [[ -z "${VPS_HOST:-}" ]]; then
            echo "ERREUR : secret VPS_HOST requis"
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts || true

      - name: Rsync to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          chmod +x deploy/rsync-to-vps.sh
          ./deploy/rsync-to-vps.sh "$VPS_HOST" "$VPS_USER" "${VPS_PORT:-22}"

      - name: Build and migrate on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/magazine
            chmod +x deploy/remote-deploy.sh
            ./deploy/remote-deploy.sh
